<script>
const SUPABASE_URL = "https://cnqeqehgpidrsuerjzbg.supabase.co";
const SUPABASE_KEY = "sb_publishable_voofaOaydNBIQvXKMXZ2lA_Daj2GPXU";

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let selectedEngineer = null;
let activeEngineers = [];
let currentShow = null;
let activeRequests = [];
let completedRequests = [];
let requestFilter = "all";
let reportType = "end";
let requestDetailReturn = { type: "history" };

let realtimeStarted = false;
let knownRequestIds = new Set();
let knownClaimedBy = new Map();
let initialRequestLoad = true;

let realtimeChannel = null;
let realtimeReconnectTimer = null;

let autoRefreshInFlight = false;
let autoRefreshPending = false;

let safetyPollIntervalId = null;

let requestToastTimeoutId = null;

let sharedAudioCtx = null;

const loginView = document.getElementById("loginView");
const appView = document.getElementById("appView");
const activeView = document.getElementById("activeView");
const menuView = document.getElementById("menuView");
const completedView = document.getElementById("completedView");
const reportsView = document.getElementById("reportsView");
const engineersView = document.getElementById("engineersView");
const showsView = document.getElementById("showsView");
const modalBackdrop = document.getElementById("modalBackdrop");
const modal = document.getElementById("modal");

document.getElementById("loginBtn")
  .addEventListener("click", login);

document.getElementById("menuBtn")
  .addEventListener("click", showMenu);

async function login() {
  document.getElementById("loginError").textContent = "";

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const { error } =
    await sb.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    document.getElementById("loginError").textContent =
      error.message;
    return;
  }

  await initializeApp();
}

async function logout() {
  await sb.auth.signOut();

  if (realtimeReconnectTimer) {
    clearTimeout(realtimeReconnectTimer);
    realtimeReconnectTimer = null;
  }

  if (safetyPollIntervalId) {
    clearInterval(safetyPollIntervalId);
    safetyPollIntervalId = null;
  }

  if (realtimeChannel) {

    const channelToRemove = realtimeChannel;

    // Clear the reference first, same as scheduleRealtimeReconnect()
    // does, so the CLOSED status event this removal triggers is
    // recognized as stale (channel !== realtimeChannel) and does not
    // schedule a reconnect.
    realtimeChannel = null;

    try {
      await sb.removeChannel(channelToRemove);
    } catch (e) {
      console.warn(
        "Truck Help realtime: cleanup on logout failed",
        e
      );
    }
  }

  realtimeStarted = false;

  selectedEngineer = null;

  loginView.classList.remove("hidden");
  appView.classList.add("hidden");
}

async function checkSession() {
  const { data } = await sb.auth.getSession();

  if (data.session) {
    await initializeApp();
  } else {
    loginView.classList.remove("hidden");
    appView.classList.add("hidden");
  }
}

async function initializeApp() {
  loginView.classList.add("hidden");
  appView.classList.remove("hidden");

  await loadEngineers();

  const savedId =
    localStorage.getItem("truckHelpEngineerId");

  if (savedId) {
    selectedEngineer =
      activeEngineers.find(
        e => String(e.id) === String(savedId)
      ) || null;
  }

  updateEngineerLine();

  if (!selectedEngineer) {
    if (activeEngineers.length) {
      chooseEngineer();
    } else {
      showEngineers();
    }
  } else {
    await showActive();
  }

  startRealtime();
}

function updateEngineerLine() {
  const line =
    document.getElementById("currentEngineerLine");

  if (!selectedEngineer) {
    line.textContent = "No engineer selected";
    return;
  }

  line.textContent =
    selectedEngineer.name +
    (selectedEngineer.role
      ? " · " + selectedEngineer.role
      : "");
}

async function loadEngineers() {
  const { data, error } = await sb
    .from("Engineers")
    .select("*")
    .order("name");

  if (error) {
    console.error(error);
    return;
  }

  activeEngineers =
    (data || []).filter(e => e.active);
}

async function loadCurrentShow() {
  const { data, error } = await sb
    .from("Shows")
    .select("*")
    .eq("active", true)
    .limit(1)
    .maybeSingle();

  if (error) {
    console.error(error);
    currentShow = null;
    return;
  }

  currentShow = data || null;
}

async function loadRequests() {
  if (!currentShow) {
    activeRequests = [];
    completedRequests = [];
    renderActive();
    return;
  }

  const { data, error } = await sb
    .from("Requests")
    .select("*")
    .eq("show_id", currentShow.id)
    .order("created_at", { ascending: true });

  if (error) {
    console.error(error);
    return;
  }

  const rows = data || [];

  const activeRows =
    rows.filter(r => r.status !== "complete");

  const newRows =
    activeRows.filter(
      r => !knownRequestIds.has(String(r.id))
    );

  const newIds =
    newRows.map(r => String(r.id));

  // Hand-off detection: compare each request's previously-known
  // claimed_by (captured on the last load) against its freshly
  // loaded claimed_by, from this client's own in-memory state -
  // not the realtime payload, which doesn't reliably carry the old
  // row. Works the same regardless of whether the change was
  // discovered via realtime, focus/visibility catch-up, or the
  // safety poll, since all three funnel through loadRequests().
  const handoffRows =
    selectedEngineer
      ? activeRows.filter(r => {

          const id = String(r.id);
          const prevClaimedBy = knownClaimedBy.get(id);

          return (
            knownRequestIds.has(id) &&
            !!prevClaimedBy &&
            r.claimed_by === selectedEngineer.name &&
            prevClaimedBy !== selectedEngineer.name
          );
        })
      : [];

  activeRequests = activeRows;

  completedRequests =
    rows.filter(r => r.status === "complete")
      .sort((a,b) =>
        new Date(b.completed_at || b.created_at) -
        new Date(a.completed_at || a.created_at)
      );

  if (!initialRequestLoad && newIds.length) {
    ding();
    showNewRequestToast(newRows);
  }

  if (!initialRequestLoad && handoffRows.length) {
    ding();
  }

  knownRequestIds =
    new Set(
      activeRows.map(r => String(r.id))
    );

  knownClaimedBy =
    new Map(
      activeRows.map(
        r => [String(r.id), r.claimed_by || null]
      )
    );

  initialRequestLoad = false;

  renderActive();

  if (!completedView.classList.contains("hidden")) {
    renderCompleted();
  }
}

function sortActiveRequests(rows) {
  return [...rows].sort((a,b) => {
    if (!!a.is_priority !== !!b.is_priority) {
      return a.is_priority ? -1 : 1;
    }

    return new Date(a.created_at) -
           new Date(b.created_at);
  });
}

let logItemInProgress = false;

async function logItem() {
  if (logItemInProgress) {
    return;
  }
  logItemInProgress = true;
  try {
    await logItemImpl();
  } finally {
    logItemInProgress = false;
  }
}

async function logItemImpl() {

  const description =
    document.getElementById("logItemDescription")
      .value.trim();

  if (!description) {
    alert("Please enter a description.");
    return;
  }

  const requestType =
    document.getElementById("logItemRequestType")
      .value;

  const department =
    document.getElementById("logItemDepartment")
      .value.trim();

  const location =
    document.getElementById("logItemLocation")
      .value.trim();

  const reportedBy =
    document.getElementById("logItemReportedBy")
      .value.trim();

  const { data, error } =
    await sb.rpc("submit_truck_help_request", {
      p_requester_name: reportedBy,
      p_department: department,
      p_location: location,
      p_phone: "",
      p_request_type: requestType,
      p_description: description
    });

  if (error) {
    alert(error.message);
    return;
  }

  const requestId =
    data && data.length ? data[0].request_id : null;

  closeModal();

  if (requestId) {
    await openRequestDetail(requestId);
  } else {
    await loadRequests();
  }
}

  let statusText = "NEW REQUEST";

  if (isProgress) {
    statusText =

  if (r.is_priority) {

      String(r.phone).replace(/[^\d+]/g, "");

async function getCurrentShowEngineers() {

  if (!currentShow) {
    await loadCurrentShow();
  }

  if (!currentShow) {
    return [];
  }

  const { data: assignments, error: assignmentError } =
    await sb
      .from("Show_Engineers")
      .select("engineer_id, sort_order")
      .eq("show_id", currentShow.id)
      .order("sort_order");

  if (assignmentError) {
    alert(assignmentError.message);
    return [];
  }

  if (!assignments || !assignments.length) {
    return [];
  }

  const ids =
    assignments.map(a => a.engineer_id);

  const { data: engineers, error: engineerError } =
    await sb
      .from("Engineers")
      .select("id, name, role, active")
      .in("id", ids);

  if (engineerError) {
    alert(engineerError.message);
    return [];
  }

  const engineerMap =
    new Map(
      (engineers || []).map(e => [
        String(e.id),
        e
      ])
    );

  return assignments
    .map(a =>
      engineerMap.get(String(a.engineer_id))
    )
    .filter(Boolean);
}


async function selectedEngineerIsOnShow() {

  if (!selectedEngineer) {
    chooseEngineer();
    return false;
  }

  const crew =
    await getCurrentShowEngineers();

  const found =
    crew.some(
      e =>
        String(e.id) ===
        String(selectedEngineer.id)
    );

  if (!found) {
    alert(
      selectedEngineer.name +
      " is not assigned to this show."
    );
    return false;
  }

  return true;
}


async function claimRequest(id) {

  const allowed =

  const { error } = await sb

      status: "in-progress",

      claimed_at: new Date().toISOString()

  const showEngineers =
    await getCurrentShowEngineers();

  const engineer =
    showEngineers.find(

        String(e.id) ===
        String(engineerId)

  if (!engineer) {
    alert(
      "That engineer is not assigned to this show."
    );
    return;

  const { error } = await sb
    .from("Requests")
    .update({
      status: "in-progress",
      claimed_by: engineer.name,
      claimed_at: new Date().toISOString()
    })
    .eq("id", requestId);

  if (error) {
    alert(error.message);
    return;

  closeModal();

  if (

    String(engineer.id) ===
      String(selectedEngineer.id)

async function uploadCompletionPhotos(requestId) {

  const input =
    document.getElementById("completionPhotos");

  if (!input) {
    return { ok: true, uploaded: [] };
  }

  const files =
    Array.from(input.files || []);

  if (!files.length) {
    return { ok: true, uploaded: [] };
  }

  const uploaded = [];

  for (let index = 0; index < files.length; index++) {

    const file = files[index];

    const captionInput =
      document.getElementById(
        `completionPhotoCaption_${index}`
      );

    const caption =
      captionInput
        ? captionInput.value.trim()
        : "";

    const originalName =
      file.name || "photo";

    const dot =
      originalName.lastIndexOf(".");

    const extension =
      dot >= 0
        ? originalName.substring(dot).toLowerCase()
        : "";

    const uniqueId =
      typeof crypto !== "undefined" &&
      typeof crypto.randomUUID === "function"
        ? crypto.randomUUID()
        : `${Date.now()}-${index}-${Math.random()
            .toString(36)
            .slice(2)}`;

    const storagePath =
      `${requestId}/${uniqueId}${extension}`;

    const { error: uploadError } =
      await sb.storage
        .from("request-photos")
        .upload(
          storagePath,
          file,
          {
            cacheControl: "3600",
            upsert: false,
            contentType:
              file.type || undefined
          }
        );

    if (uploadError) {

      await cleanupCompletionPhotoUploads(
        uploaded
      );

      return {
        ok: false,
        uploaded: [],
        error:
          "Photo upload failed:\n\n" +
          uploadError.message
      };
    }

    const { data: photoRecord, error: recordError } =
      await sb
        .from("Request_Photos")
        .insert({
          request_id: requestId,
          storage_path: storagePath,
          caption: caption || null,
          added_by:
            selectedEngineer
              ? selectedEngineer.name
              : "Unknown Engineer"
        })
        .select("id, storage_path")
        .single();

    if (recordError) {

      await sb.storage
        .from("request-photos")
        .remove([storagePath]);

      await cleanupCompletionPhotoUploads(
        uploaded
      );

      return {
        ok: false,
        uploaded: [],
        error:
          "Photo record could not be saved:\n\n" +
          recordError.message
      };
    }

    uploaded.push({
      id: photoRecord.id,
      storage_path: storagePath
    });
  }

  return {
    ok: true,
    uploaded
  };
}


async function cleanupCompletionPhotoUploads(uploaded) {

  if (!uploaded || !uploaded.length) {
    return;
  }

  const ids =
    uploaded
      .map(item => item.id)
      .filter(Boolean);

  const paths =
    uploaded
      .map(item => item.storage_path)
      .filter(Boolean);

  if (ids.length) {

    await sb
      .from("Request_Photos")
      .delete()
      .in("id", ids);
  }

  if (paths.length) {

    await sb.storage
      .from("request-photos")
      .remove(paths);
  }
}


let completeRequestInProgress = false;

async function completeRequest(id) {
  if (completeRequestInProgress) {
    return;
  }
  completeRequestInProgress = true;
  try {
    await completeRequestImpl(id);
  } finally {
    completeRequestInProgress = false;
  }
}

async function completeRequestImpl(id) {
  const notes =
    document.getElementById("resolutionNotes")
      .value.trim();

  const gearLocationValue =
    document.getElementById("gearLocation")
      .value.trim();



  const endOfShow =
    document.getElementById("endOfShowCheck").checked;

  const category =
    endOfShow
      ? document.getElementById("endOfShowCategory").value
      : null;

  const clientReport =
    document.getElementById("clientReportCheck").checked;

  const clientCategory =
    clientReport
      ? document.getElementById("clientReportCategory").value
      : null;
  const createFollowUp =
    document.getElementById("followUpCheck").checked;

  const followUpCategory =
    createFollowUp
      ? document.getElementById("followUpCategory").value
      : null;

  const followUpNextAction =
    createFollowUp
      ? document.getElementById("followUpNextAction").value.trim()
      : null;

  const followUpKind =
    createFollowUp
      ? document.getElementById("followUpKind").value
      : null;

  const followUpEquipmentName =
    createFollowUp
      ? document.getElementById("followUpEquipmentName").value.trim()
      : null;

  const followUpEquipmentMakeModel =
    createFollowUp
      ? document.getElementById("followUpEquipmentMakeModel").value.trim()
      : null;

  const followUpEquipmentSerial =
    createFollowUp
      ? document.getElementById("followUpEquipmentSerial").value.trim()
      : null;

  const followUpEquipmentAssetId =
    createFollowUp
      ? document.getElementById("followUpEquipmentAssetId").value.trim()
      : null;

  if (createFollowUp && !followUpNextAction) {

    alert("Please enter a short Next Action.");

    return;

  }

  
  const photoUploadResult =
    await uploadCompletionPhotos(id);

  if (!photoUploadResult.ok) {

    alert(photoUploadResult.error);

    return;
  }


const { data: requestRecord, error: requestLookupError } =
    await sb
      .from("Requests")
      .select("description, show_id")
      .eq("id", id)
      .single();

  if (requestLookupError) {

    alert(requestLookupError.message);

    return;

  }



  const { error } = await sb
    .from("Requests")
    .update({
      status: "complete",
      completed_at: new Date().toISOString(),
      completed_by:
        selectedEngineer
          ? selectedEngineer.name
          : null,
      resolution_notes:
        notes || null,

      gear_location:
        gearLocationValue || null,

      end_of_show_report: endOfShow,
      end_of_show_category: category,
      client_report: clientReport,
      client_report_category: clientCategory
    })
    .eq("id", id);

  if (error) {

    await cleanupCompletionPhotoUploads(
      photoUploadResult.uploaded
    );

    alert(error.message);

    return;

  }
  if (createFollowUp) {

    const { data: newFollowUp, error: followUpError } = await sb
      .from("Follow_Ups")
      .insert({
        request_id: id,
        show_id: requestRecord.show_id,
        category: followUpCategory,
        title: requestRecord.description || "Follow-Up",
        next_action: followUpNextAction,
        status: "open",
        follow_up_kind: followUpKind || "action",
        equipment_name: followUpEquipmentName || null,
        equipment_make_model: followUpEquipmentMakeModel || null,
        equipment_serial: followUpEquipmentSerial || null,
        equipment_asset_id: followUpEquipmentAssetId || null,
        created_by:
          selectedEngineer
            ? selectedEngineer.name
            : null
      })
      .select("id")
      .single();

    if (followUpError) {

      alert(
        "Request completed, but Follow-Up could not be saved:\n\n" +
        followUpError.message
      );

      closeModal();

      await loadRequests();

      return;

    }

    const { error: firstEventError } = await sb
      .from("Follow_Up_Events")
      .insert({
        follow_up_id: newFollowUp.id,
        show_id: requestRecord.show_id,
        event_type: "discovered",
        event_at: new Date().toISOString(),
        notes:
          (requestRecord.description
            ? requestRecord.description + " — "
            : "") + followUpNextAction,
        created_by:
          selectedEngineer
            ? selectedEngineer.name
            : null
      });

    if (firstEventError) {

      alert(
        "Follow-Up was created, but its history entry could not be saved:\n\n" +
        firstEventError.message
      );

    }

  }



  closeModal();
  await loadRequests();
}

function filterRequestHistory() {

  const search =
    (
      document.getElementById("historySearch")
        ?.value || ""
    )
      .trim()
      .toLowerCase();


  const department =
    document.getElementById("historyDepartment")
      ?.value || "";


  const status =
    document.getElementById("historyStatus")
      ?.value || "";


  const engineer =
    document.getElementById("historyEngineer")
      ?.value || "";


  const priority =
    document.getElementById("historyPriority")
      ?.value || "";


  const cards =
    document.querySelectorAll(
      ".request-history-card"
    );


  let visible = 0;


  cards.forEach(card => {

    const matchesSearch =
      !search ||
      (card.dataset.search || "")
        .includes(search);


    const matchesDepartment =
      !department ||
      card.dataset.department === department;


    const matchesStatus =
      !status ||
      card.dataset.status === status;


    const matchesEngineer =
      !engineer ||
      (card.dataset.engineers || "")
        .includes(engineer);


    const matchesPriority =
      !priority ||
      card.dataset.priority === priority;


    const show =
      matchesSearch &&
      matchesDepartment &&
      matchesStatus &&
      matchesEngineer &&
      matchesPriority;


    card.style.display =
      show ? "" : "none";


    if (show) {
      visible++;
    }
  });


  const count =
    document.getElementById(
      "historyResultCount"
    );


  if (count) {

    count.textContent =
      visible === 1
        ? "1 request"
        : `${visible} requests`;
  }


  const noResults =
    document.getElementById(
      "requestHistoryNoResults"
    );


  if (noResults) {

    noResults.style.display =
      visible === 0
        ? "block"
        : "none";
  }
}





async function deleteRequestPhoto(
  requestId,
  photoId,
  storagePath
) {

  if (!window.confirm("Delete this photo?")) {
    return;
  }

  const { data: request, error: requestError } =
    await sb
      .from("Requests")
      .select("status")
      .eq("id", requestId)
      .single();

  if (requestError) {
    alert(
      "Could not verify request status:\n\n" +
      requestError.message
    );
    return;
  }

  if (request.status === "complete") {
    alert("Completed request photos are permanent.");
    await openRequestDetail(requestId);
    return;
  }

  const { error: storageError } =
    await sb.storage
      .from("request-photos")
      .remove([storagePath]);

  if (storageError) {
    alert(
      "Could not delete photo file:\n\n" +
      storageError.message
    );
    return;
  }

  const { error: rowError } =
    await sb
      .from("Request_Photos")
      .delete()
      .eq("id", photoId)
      .eq("request_id", requestId);

  if (rowError) {
    alert(
      "Photo file deleted, but photo record removal failed:\n\n" +
      rowError.message
    );
    return;
  }

  await openRequestDetail(requestId);
}

    const dot =
      originalName.lastIndexOf(".");

    const extension =
      dot >= 0
        ? originalName.substring(dot).toLowerCase()
        : "";

    const uniqueId =
      typeof crypto !== "undefined" &&
      typeof crypto.randomUUID === "function"
        ? crypto.randomUUID()
        : `${Date.now()}-${index}-${Math.random()
            .toString(36)
            .slice(2)}`;

    const storagePath =
      `${requestId}/${uniqueId}${extension}`;

    const { error: uploadError } =
      await sb.storage
        .from("request-photos")
        .upload(
          storagePath,
          file,
          {
            cacheControl: "3600",
            upsert: false,
            contentType:
              file.type || undefined
          }
        );

    if (uploadError) {

      alert(
        "Photo upload failed:\n\n" +
        uploadError.message
      );

      return;
    }

    const { data: record, error: recordError } =
      await sb
        .from("Request_Photos")
        .insert({
          request_id: requestId,
          storage_path: storagePath,
          caption: caption || null,
          added_by:
            selectedEngineer
              ? selectedEngineer.name
              : "Unknown Engineer"
        })
        .select("id")
        .single();

    if (recordError) {

      alert(
        "Photo record could not be saved:\n\n" +
        recordError.message
      );

      return;
    }

    uploaded.push(record);
  }

  closeModal();

  await openRequestDetail(requestId);
}



function printRequestDetail() {

  const box =
    document.getElementById("includeRequestPhotos");

  const includePhotos =
    box && box.checked;

  const photoSections =
    Array.from(
      document.querySelectorAll(
        ".request-photo-section"
      )
    );

  if (!includePhotos) {

    photoSections.forEach(section => {
      section.dataset.beforePrintDisplay =
        section.style.display || "";

      section.style.display = "none";
    });
  }

  const restore = () => {

    photoSections.forEach(section => {

      section.style.display =
        section.dataset.beforePrintDisplay || "";

      delete section.dataset.beforePrintDisplay;
    });
  };

  window.addEventListener(
    "afterprint",
    restore,
    { once:true }
  );

  window.print();

}

const OFFICIAL_REPORT_DISPOSITIONS = [
  { value: "repair_required", label: "REPAIR REQUIRED" },
  { value: "replacement_required", label: "REPLACEMENT REQUIRED" },
  { value: "missing", label: "MISSING" },
  { value: "show_extra_billable", label: "SHOW EXTRA / BILLABLE — OPS ACTION REQUIRED" },
  { value: "monitor_verify", label: "MONITOR / VERIFY — NO ACTION YET" },
  { value: "fyi", label: "FYI — NO ACTION REQUIRED" }
];

function officialReportDispositionLabel(value) {
  const match =
    OFFICIAL_REPORT_DISPOSITIONS.find(d => d.value === value);

  return match ? match.label : (value || "—");
}

function officialReportDispositionClass(value) {
  if (
    value === "repair_required" ||
    value === "replacement_required" ||
    value === "missing" ||
    value === "show_extra_billable"
  ) {
    return "disposition-action";
  }

  if (value === "monitor_verify") {
    return "disposition-monitor";
  }

  return "disposition-fyi";
}

    return;

    await saveDocumentIncidentImpl(requestId);

    saveDocumentIncidentInProgress = false;

async function saveDocumentIncidentImpl(requestId) {

  const notesInput =
    document.getElementById("documentIncidentNotes");

  const notes =
    notesInput
      ? notesInput.value.trim()
      : "";

  if (!notes) {
    alert("Please enter a description of the incident.");
    return;

  const { error } = await sb
    .from("Request_Notes")
    .insert({
      request_id: requestId,
      show_id:
        currentShow
          ? currentShow.id
          : null,
      note_type: "documentation",
      notes,
      created_by:
        selectedEngineer
          ? selectedEngineer.name
          : null
    });

  if (error) {
    alert(
      "Could not save note:\n\n" +
      error.message
    );
    return;
  }

  closeModal();

  await openRequestDetail(requestId);
}

async function saveEditClassificationImpl(requestId) {

  const reason =
    document.getElementById("editClassificationReason")
      .value.trim();

  if (!reason) {
    alert("Please enter a reason for this change.");
    return;
  }

  const endOfShowReport =
    document.getElementById("editEndOfShowCheck").checked;

  const endOfShowCategory =
    endOfShowReport
      ? document.getElementById("editEndOfShowCategory").value
      : null;

  const clientReport =
    document.getElementById("editClientReportCheck").checked;

  const clientReportCategory =
    clientReport
      ? document.getElementById("editClientReportCategory").value
      : null;

  const { data: before, error: beforeError } =
    await sb
      .from("Requests")
      .select(
        "end_of_show_report, end_of_show_category, client_report, client_report_category"
      )
      .eq("id", requestId)
      .single();

  if (beforeError) {
    alert(beforeError.message);
    return;
  }

  const { error: updateError } = await sb
    .from("Requests")
    .update({
      end_of_show_report: endOfShowReport,
      end_of_show_category: endOfShowCategory,
      client_report: clientReport,
      client_report_category: clientReportCategory
    })
    .eq("id", requestId);

  if (updateError) {
    alert(updateError.message);
    return;
  }

  const changeNote =
    "Classification changed.\n\n" +
    "Before:\n" +
    `  End-of-Show Report: ${before.end_of_show_report ? "Yes" : "No"}` +
    (before.end_of_show_report ? ` (${before.end_of_show_category || "—"})` : "") +
    "\n" +
    `  Client Damage/Missing: ${before.client_report ? "Yes" : "No"}` +
    (before.client_report ? ` (${before.client_report_category || "—"})` : "") +
    "\n\n" +
    "After:\n" +
    `  End-of-Show Report: ${endOfShowReport ? "Yes" : "No"}` +
    (endOfShowReport ? ` (${endOfShowCategory || "—"})` : "") +
    "\n" +

function filterPastShows() {

  const input =
    document.getElementById("pastShowSearch");

  if (!input) return;

  const term =
    input.value
      .trim()
      .toLowerCase();

  const cards =
    document.querySelectorAll(".past-show-card");

  let visible = 0;

  cards.forEach(card => {

    const search =
      (card.dataset.search || "")
        .toLowerCase();

    const match =
      !term || search.includes(term);

    card.style.display =
      match ? "" : "none";

    if (match) visible++;
  });

  let message =
    document.getElementById("pastShowNoResults");

  if (!message) {

    message =
      document.createElement("div");

    message.id =
      "pastShowNoResults";

    message.className =
      "empty";

    message.style.marginTop =
      "14px";

    const content =
      document.getElementById("pastShowsContent");

    if (content) {
      content.appendChild(message);
    }
  }

  if (term && visible === 0) {

    message.textContent =
      "No past shows match your search.";

    message.style.display =
      "block";

  } else {

    message.style.display =
      "none";
  }
}

let saveManualFollowUpInProgress = false;

async function saveManualFollowUp() {
  if (saveManualFollowUpInProgress) {
    return;
  }
  saveManualFollowUpInProgress = true;
  try {
    await saveManualFollowUpImpl();
  } finally {
    saveManualFollowUpInProgress = false;
  }
}

async function saveManualFollowUpImpl() {

  const category =
    document
      .getElementById("manualFollowUpCategory")
      .value;

  const title =
    document
      .getElementById("manualFollowUpTitle")
      .value
      .trim();

  const nextAction =
    document
      .getElementById("manualFollowUpNextAction")
      .value
      .trim();

  const showValue =
    document
      .getElementById("manualFollowUpShow")
      .value;

  const kind =
    document
      .getElementById("manualFollowUpKind")
      .value;

  const equipmentName =
    document
      .getElementById("manualFollowUpEquipmentName")
      .value
      .trim();

  const equipmentMakeModel =
    document
      .getElementById("manualFollowUpEquipmentMakeModel")
      .value
      .trim();

  const equipmentSerial =
    document
      .getElementById("manualFollowUpEquipmentSerial")
      .value
      .trim();

  const equipmentAssetId =
    document
      .getElementById("manualFollowUpEquipmentAssetId")
      .value
      .trim();

  if (!title) {
    alert("Please enter what needs attention.");
    return;
  }

  if (!nextAction) {
    alert("Please enter a short Next Action.");
    return;
  }

  const showId =
    showValue
      ? Number(showValue)
      : null;


  // ---------------------------------------------
  // CHECK FOR POSSIBLE DUPLICATE OPEN FOLLOW-UP
  // ---------------------------------------------

  let duplicateQuery = sb
    .from("Follow_Ups")
    .select("id, title, next_action")
    .eq("status", "open");

  if (showId === null) {
    duplicateQuery =
      duplicateQuery.is("show_id", null);
  } else {
    duplicateQuery =
      duplicateQuery.eq("show_id", showId);
  }

  const {
    data: existingFollowUps,
    error: duplicateError
  } = await duplicateQuery;

  if (duplicateError) {
    alert(duplicateError.message);
    return;
  }


  const normalize = value =>
    (value || "")
      .toLowerCase()
      .replace(/[^a-z0-9\s]/g, " ")
      .replace(/\s+/g, " ")
      .trim();


  const newWords =
    normalize(title)
      .split(" ")
      .filter(word => word.length > 2);


  const possibleDuplicate =
    (existingFollowUps || []).find(item => {

      const existingTitle =
        normalize(item.title);

      if (!existingTitle) {
        return false;
      }

      const existingWords =
        existingTitle
          .split(" ")
          .filter(word => word.length > 2);

      if (
        normalize(title) === existingTitle
      ) {
        return true;
      }

      const matchingWords =
        newWords.filter(word =>
          existingWords.includes(word)
        );

      const smallestWordCount =
        Math.min(
          newWords.length,
          existingWords.length
        );

      return (
        smallestWordCount >= 2 &&
        matchingWords.length >=
          Math.ceil(smallestWordCount * 0.6)
      );
    });


  if (possibleDuplicate) {

    const addAnyway = confirm(
      "Possible existing Follow-Up found:\n\n" +
      possibleDuplicate.title +
      "\n\nNext Action: " +
      (possibleDuplicate.next_action || "—") +
      "\n\nAdd this new Follow-Up anyway?"
    );

    if (!addAnyway) {
      return;
    }
  }


  // ---------------------------------------------
  // SAVE FOLLOW-UP
  // ---------------------------------------------

  const { data: newFollowUp, error } = await sb
    .from("Follow_Ups")
    .insert({
      request_id: null,
      show_id: showId,
      category,
      title,
      next_action: nextAction,
      status: "open",
      follow_up_kind: kind || "action",
      equipment_name: equipmentName || null,
      equipment_make_model: equipmentMakeModel || null,
      equipment_serial: equipmentSerial || null,
      equipment_asset_id: equipmentAssetId || null,
      created_by:
        selectedEngineer
          ? selectedEngineer.name
          : null
    })
    .select("id")
    .single();

  if (error) {
    alert(error.message);
    return;
  }

  const { error: firstEventError } = await sb
    .from("Follow_Up_Events")
    .insert({
      follow_up_id: newFollowUp.id,
      show_id: showId,
      event_type: "discovered",
      event_at: new Date().toISOString(),
      notes: title + " — " + nextAction,
      created_by:
        selectedEngineer
          ? selectedEngineer.name
          : null
    });

  if (firstEventError) {

    alert(
      "Follow-Up was created, but its history entry could not be saved:\n\n" +
      firstEventError.message
    );

  }

  closeModal();

  followUpViewStatus = "open";

  await showFollowUps();
}

let resolveFollowUpInProgress = false;

async function resolveFollowUp(id, returnTo = false) {
  if (resolveFollowUpInProgress) {
    return;
  }
  resolveFollowUpInProgress = true;
  try {
    await resolveFollowUpImpl(id, returnTo);
  } finally {
    resolveFollowUpInProgress = false;
  }
}

async function resolveFollowUpImpl(id, returnTo = false) {

  const resolution = prompt(
    "Resolution:"
  );

  if (resolution === null) {
    return;
  }

  const cleanResolution = resolution.trim();

  if (!cleanResolution) {
    alert("Please enter a short resolution.");
    return;
  }

  const resolvedAt = new Date().toISOString();

  const { error } = await sb
    .from("Follow_Ups")
    .update({
      status: "resolved",
      resolved_at: resolvedAt,
      resolved_by:
        selectedEngineer
          ? selectedEngineer.name
          : null,
      resolution: cleanResolution
    })
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  const { error: resolvedEventError } = await sb
    .from("Follow_Up_Events")
    .insert({
      follow_up_id: id,
      show_id:
        currentShow
          ? currentShow.id
          : null,
      event_type: "resolved",
      event_at: resolvedAt,
      notes: cleanResolution,
      created_by:
        selectedEngineer
          ? selectedEngineer.name
          : null
    });

  if (resolvedEventError) {

    alert(
      "Follow-Up was resolved, but its final history entry could not be saved:\n\n" +
      resolvedEventError.message
    );

  }

  if (returnTo === true) {

    closeModal();

    await showShowCloseout();

  } else if (returnTo === "detail") {

    await openFollowUpDetail(id);

  } else {

    await showFollowUps();
  }
}

                      : ""
                  }

function toggleLogEventDestination() {

    document.getElementById("logEventType");

    document.getElementById("logEventDestinationWrap");

    return;

  wrap.classList.toggle(
    "hidden",
    typeEl.value !== "sent_to_shop"
  );

let saveFollowUpEventInProgress = false;

async function saveFollowUpEvent(id) {
  if (saveFollowUpEventInProgress) {
    return;
  }
  saveFollowUpEventInProgress = true;
  try {
    await saveFollowUpEventImpl(id);
  } finally {
    saveFollowUpEventInProgress = false;
  }
}

async function saveFollowUpEventImpl(id) {

  const eventType =
    document.getElementById("logEventType").value;

  const eventAtLocal =
    document.getElementById("logEventAt").value;

  const eventAt =
    logEventAtTouched && eventAtLocal
      ? new Date(eventAtLocal).toISOString()
      : new Date().toISOString();

  const showValue =
    document.getElementById("logEventShow").value;

  const showId =
    showValue
      ? Number(showValue)
      : null;

  const destinationInput =
    document.getElementById("logEventDestination");

  const destination =
    destinationInput
      ? destinationInput.value.trim()
      : "";

  const notes =
    document.getElementById("logEventNotes").value.trim();

  const { error } = await sb
    .from("Follow_Up_Events")
    .insert({
      follow_up_id: id,
      show_id: showId,
      event_type: eventType,
      event_at: eventAt,
      destination: destination || null,
      notes: notes || null,
      created_by:
        selectedEngineer
          ? selectedEngineer.name
          : null
    });

  if (error) {
    alert(error.message);
    return;
  }

  closeModal();

  await openFollowUpDetail(id);
}


let changeFollowUpKindInProgress = false;

async function changeFollowUpKindToAction(id) {
  if (changeFollowUpKindInProgress) {
    return;
  }
  changeFollowUpKindInProgress = true;

    changeFollowUpKindInProgress = false;

}

async function changeFollowUpKindToActionImpl(id) {

  const { error } = await sb
    .from("Follow_Ups")

    .eq("id", id);

  }

  await openFollowUpDetail(id);
}

async function addEngineeringLogEntryImpl() {
  if (!currentShow) {
    return;
  }

  if (!selectedEngineer) {
    alert("Select an engineer first.");
    return;
  }

  const noteInput =
    document.getElementById("engineeringLogNote");

  const requestSelect =
    document.getElementById("engineeringLogRequest");

  const note =
    noteInput?.value.trim() || "";

  if (!note) {
    alert("Enter a log note.");
    return;
  }

  const requestId =
    requestSelect?.value
      ? Number(requestSelect.value)
      : null;

  const { error } =
    await sb
      .from("Engineering_Log")
      .insert({
        show_id: currentShow.id,
        request_id: requestId,
        engineer_name: selectedEngineer.name,
        note
      });

  if (error) {
    console.error(error);
    alert("Could not add engineering log entry.");

    requestSelect.value = "";
  }

  await loadEngineeringLogEntries();

              : "GENERAL / NO SHOW";

            return `
              <div class="request-card"
                style="margin-bottom:10px;">

                <div style="
                  display:flex;
                  justify-content:space-between;
                  gap:12px;
                  align-items:flex-start;
                ">

                  <div>
                    <strong>
                      ${escapeHtml(r.title || "Follow-Up")}
                    </strong>

                    ${
                      r.follow_up_kind === "watch"
                        ? `
                          <span class="badge"
                            style="margin-left:6px;">
                            WATCH
                          </span>
                        `
                        : ""
                    }
                  </div>

                  <button class="small-btn"
                    onclick="openFollowUpDetail(${r.id}, { type: 'followUpsList' })">
                    OPEN
                  </button>

                </div>

                <div style="margin-top:8px;">
                  <strong>Next Action:</strong>
                  ${escapeHtml(r.next_action || "—")}
                </div>

                <div class="muted"
                  style="margin-top:8px;">
                  ${escapeHtml(showText)}
                </div>

                <div class="muted"
                  style="margin-top:4px;">
                  Added by:
                  ${escapeHtml(r.created_by || "—")}
                </div>

                ${
                  followUpViewStatus === "resolved"
                    ? `
                      <div style="margin-top:10px;">
                        <strong>Resolution:</strong>
                        ${escapeHtml(r.resolution || "—")}
                      </div>

                      <div class="muted"

                        Resolved by:
                        ${escapeHtml(r.resolved_by || "—")}

                    : `
                      <button class="primary"

                }

              </div>

          }).join("")}

        </div>
      `;

    }).join("");

}

function setReportType(type) {
  reportType = type;

  const endTab =
    document.getElementById("endReportTab");

  const clientTab =
    document.getElementById("clientReportTab");

  const officialTab =
    document.getElementById("officialReportTab");

  if (endTab && clientTab && officialTab) {
    endTab.classList.toggle(
      "active",
      type === "end"
    );

    clientTab.classList.toggle(
      "active",
      type === "client"
    );

    officialTab.classList.toggle(
      "active",
      type === "official"
    );
  }

  const select =
    document.getElementById("reportShowSelect");

  if (select) {
    loadSelectedReport(select.value);
  }
}

async function loadSelectedReport(showId) {
  if (reportType === "client") {
    await loadClientReport(showId);
  } else if (reportType === "official") {
    await loadOfficialShowReport(showId);
  } else {
    await loadShowReport(showId);
  }
}

async function loadShowReport(showId) {
  const { data: show, error: showError } = await sb
    .from("Shows")
    .select("*")
    .eq("id", showId)
    .single();

  if (showError) {
    document.getElementById("reportContent").innerHTML =
      `<div class="error">${escapeHtml(showError.message)}</div>`;
    return;
  }

  const { data: requests, error: requestError } = await sb
    .from("Requests")
    .select("*")
    .eq("show_id", showId)
    .order("created_at", { ascending: true });

  if (requestError) {
    document.getElementById("reportContent").innerHTML =
      `<div class="error">${escapeHtml(requestError.message)}</div>`;
    return;
  }

  const rows = requests || [];

  const total = rows.length;
  const completed =
    rows.filter(r => r.status === "complete").length;
  const outstanding =
    rows.filter(r => r.status !== "complete").length;

  const endItems =
    rows.filter(r => r.end_of_show_report);

  const categories = [
    "Repair Needed",
    "Broken Gear",
    "Lost / Missing Gear",
    "Other"
  ];

  const content =
    document.getElementById("reportContent");

  content.innerHTML = `
    <div class="report-sheet">

      <div class="report-title">
        TRUCK HELP — END OF SHOW REPORT
      </div>

      <div class="report-show">
        ${escapeHtml(show.show_name || "")}
      </div>

      <div class="report-meta">
        <div>
          <strong>Venue:</strong>
          ${escapeHtml(show.venue || "—")}
        </div>

        <div>
          <strong>Start Date:</strong>
          ${escapeHtml(show.start_date || "—")}
        </div>

        <div>
          <strong>Status:</strong>
          ${show.active ? "Active" : "Closed"}
        </div>

        <div>
          <strong>Started By:</strong>
          ${escapeHtml(show.started_by || "—")}
        </div>

        <div>
          <strong>Closed By:</strong>
          ${escapeHtml(show.closed_by || "—")}
        </div>
      </div>

      <div class="report-totals">
        <div class="report-total-box">
          <div class="report-total-number">${total}</div>
          <div class="report-total-label">Total Requests</div>
        </div>

        <div class="report-total-box">
          <div class="report-total-number">${completed}</div>
          <div class="report-total-label">Completed</div>
        </div>

        <div class="report-total-box">
          <div class="report-total-number">${outstanding}</div>
          <div class="report-total-label">Open Requests</div>
        </div>

        <div class="report-total-box">
          <div class="report-total-number">${endItems.length}</div>
          <div class="report-total-label">End-of-Show Items</div>
        </div>
      </div>

      <div class="no-print"
        style="margin:18px 0;">
        <button class="primary"
          onclick="window.print()">
          PRINT REPORT
        </button>
      </div>

      ${
        endItems.length
        ? categories.map(category => {
            const items =
              endItems.filter(
                r => (r.end_of_show_category || "Other") === category
              );

  const { data: requests, error: requestError } = await sb
    .from("Requests")
    .select("*")
    .eq("show_id", showId)
    .eq("client_report", true)
    .order("created_at", { ascending: true });

  if (requestError) {
    content.innerHTML =
      `<div class="error">${escapeHtml(requestError.message)}</div>`;
    return;
  }

  const rows = requests || [];

  // Load documentation photos for client-report items.
  const requestIds = rows.map(r => r.id);

  let photosByRequest = {};

  if (requestIds.length) {

    const { data: reportPhotos, error: photoError } =
      await sb
        .from("Request_Photos")
        .select("*")
        .in("request_id", requestIds)
        .order("created_at", { ascending: true });

    if (photoError) {
      console.error(
        "Client report photo load failed:",
        photoError
      );
    }

    for (const photo of (reportPhotos || [])) {

      const { data: signedData, error: signedError } =
        await sb.storage
          .from("request-photos")
          .createSignedUrl(
            photo.storage_path,
            3600
          );

      if (signedError) {

          "Client report signed URL failed:",
          signedError
        );
        continue;

      if (!photosByRequest[photo.request_id]) {
        photosByRequest[photo.request_id] = [];
      }

      photosByRequest[photo.request_id].push({
        ...photo,
        signed_url: signedData.signedUrl

function printClientReport() {

  const box =
    document.getElementById(
      "includeClientReportPhotos"
    );

  const includePhotos =
    box && box.checked;

  const photoSections =
    Array.from(
      document.querySelectorAll(
        ".client-report-photo-section"
      )
    );

  if (!includePhotos) {

    photoSections.forEach(section => {

      section.dataset.beforePrintDisplay =
        section.style.display || "";

      section.style.display = "none";
    });
  }

  const restore = () => {

    photoSections.forEach(section => {

      section.style.display =
        section.dataset.beforePrintDisplay || "";

      delete section.dataset.beforePrintDisplay;
    });
  };

  window.addEventListener(
    "afterprint",
    restore,
    { once:true }
  );

  window.print();
}

    await addEngineerImpl();

    addEngineerInProgress = false;

}

async function addEngineerImpl() {
  const name =
    document.getElementById("newEngineerName")
      .value.trim();

  const role =
    document.getElementById("newEngineerRole")
      .value;

  if (!name) {
    alert("Enter an engineer name.");
    return;
  }

  const { data, error } = await sb
    .from("Engineers")
    .insert({
      name,
      role,
      active: true
    })
    .select()
    .single();

  if (error) {
    alert(error.message);
    return;
  }

  await loadEngineers();

  selectedEngineer = data;

  localStorage.setItem(
    "truckHelpEngineerId",
    data.id
  );

  updateEngineerLine();

  await showActive();
}

async function toggleEngineer(id, active) {
  const { error } = await sb
    .from("Engineers")
    .update({ active })
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  if (
    selectedEngineer &&
    String(selectedEngineer.id) === String(id) &&
    !active
  ) {
    selectedEngineer = null;
    localStorage.removeItem("truckHelpEngineerId");
    updateEngineerLine();
  }

  await loadEngineers();
  await showEngineers();
}

async function saveEditShowImpl() {

  const showName =
    document.getElementById("editShowName")
      .value.trim();

  const showNumber =
    document.getElementById("editShowNumber")
      .value.trim();

  const clientNetwork =
    document.getElementById("editClientNetwork")
      .value.trim();

  const venue =
    document.getElementById("editVenue")
      .value.trim();

  const startDate =
    document.getElementById("editStartDate")
      .value;

  const mainUnit =
    document.getElementById("editMainUnit")
      .value.trim();

  const bUnit =
    document.getElementById("editBUnit")
      .value.trim();

  if (!showName) {
    alert("Enter a show name.");
    return;
  }

  if (!mainUnit) {
    alert("Enter the MU / Main Unit.");
    return;
  }

  const selectedCrew =
    Array.from(
      document.querySelectorAll(
        ".show-engineer-checkbox:checked"
      )
    )
    .map(el => Number(el.value));

  const { error: showError } =
    await sb
      .from("Shows")
      .update({
        show_name: showName,
        show_number: showNumber || null,
        client_network: clientNetwork || null,
        venue,
        start_date: startDate || null,
        main_unit: mainUnit,
        b_unit: bUnit || null
      })
      .eq("id", currentShow.id);

  if (showError) {
    alert(showError.message);
    return;
  }

  const { error: deleteError } =
    await sb
      .from("Show_Engineers")
      .delete()
      .eq("show_id", currentShow.id);

  if (deleteError) {
    alert(deleteError.message);
    return;
  }

  if (selectedCrew.length) {

    const rows =
      selectedCrew.map((engineerId, index) => ({
        show_id: currentShow.id,
        engineer_id: engineerId,
        sort_order: index
      }));

    const { error: insertError } =
      await sb
        .from("Show_Engineers")
        .insert(rows);

    if (insertError) {
      alert(insertError.message);
      return;
    }
  }

  closeModal();

  await loadCurrentShow();

  await showShows();
}

let startShowInProgress = false;

async function startShow() {
  if (startShowInProgress) {
    return;
  }
  startShowInProgress = true;
  try {
    await startShowImpl();
  } finally {
    startShowInProgress = false;
  }
}

async function startShowImpl() {

  const showName =
    document.getElementById("showNameInput")
      .value.trim();

  const showNumber =
    document.getElementById("showNumberInput")
      .value.trim();

  const clientNetwork =
    document.getElementById("clientNetworkInput")
      .value.trim();

  const venue =
    document.getElementById("venueInput")
      .value.trim();

  const startDate =
    document.getElementById("startDateInput")
      .value;

  const mainUnit =
    document.getElementById("mainUnitInput")
      .value.trim();

  const bUnit =
    document.getElementById("bUnitInput")
      .value.trim();

  if (!showName) {
    alert("Enter a show name.");
    return;
  }

  if (!mainUnit) {
    alert("Enter the MU / Main Unit.");
    return;
  }

  const selectedCrew =
    Array.from(
      document.querySelectorAll(
        ".start-show-engineer-checkbox:checked"
      )
    )
    .map(el => Number(el.value));

  const { data: newShow, error } =
    await sb
      .from("Shows")
      .insert({
        show_name: showName,
        show_number: showNumber || null,
        client_network: clientNetwork || null,
        venue,
        start_date: startDate || null,
        main_unit: mainUnit,
        b_unit: bUnit || null,
        active: true,
        started_by:
          selectedEngineer
            ? selectedEngineer.name
            : null
      })
      .select()
      .single();

  if (error) {
    alert(error.message);
    return;
  }

  if (selectedCrew.length) {

    const crewRows =
      selectedCrew.map((engineerId, index) => ({
        show_id: newShow.id,
        engineer_id: engineerId,
        sort_order: index
      }));

    const { error: crewError } =
      await sb
        .from("Show_Engineers")
        .insert(crewRows);

    if (crewError) {
      alert(
        "Show started, but crew assignments could not be saved:\n\n" +
        crewError.message
      );
      return;
    }
  }

  initialRequestLoad = true;
  knownRequestIds = new Set();
  knownClaimedBy = new Map();

  await showActive();
}


async function confirmCloseShow() {

  await showShowCloseout();
}

async function finalizeShowCloseout() {

  if (!currentShow) {
    return;
  }

  const notes =
    document.getElementById("closeoutNotes")
      ?.value
      ?.trim() || "";


  // Re-read requests so the snapshot reflects
  // the exact condition at the moment of close.

  const { data: requests, error: requestError } =
    await sb
      .from("Requests")
      .select("*")
      .eq("show_id", currentShow.id);

  if (requestError) {
    alert(requestError.message);
    return;
  }

  const rows = requests || [];

  const completed =
    rows.filter(
      r => r.status === "complete"
    ).length;

  const openRequests =
    rows.filter(
      r => r.status !== "complete"
    ).length;

  const endItems =
    rows.filter(
      r => r.end_of_show_report
    ).length;

  const clientItems =
    rows.filter(
      r => r.client_report
    ).length;


  const { data: followUps, error: followUpError } =
    await sb
      .from("Follow_Ups")
      .select("id,status")
      .eq("show_id", currentShow.id);

  if (followUpError) {
    alert(followUpError.message);
    return;
  }

  const followRows = followUps || [];

  const openFollowUps =
    followRows.filter(
      f => f.status === "open"
    ).length;


  if (openRequests || openFollowUps) {

    const proceed = window.confirm(
      "Outstanding engineering items remain.\n\n" +
      `${openRequests} active request(s)\n` +
      `${openFollowUps} open follow-up(s)\n\n` +
      "Close the show anyway?"
    );

    if (!proceed) {
      return;
    }
  }


  const { error } =
    await sb
      .from("Shows")
      .update({

        active: false,

        closed_at:
          new Date().toISOString(),

        closed_by:
          selectedEngineer
            ? selectedEngineer.name
            : null,

        closeout_notes:
          notes || null,

        closeout_total_requests:
          rows.length,

        closeout_completed_requests:
          completed,

        closeout_open_requests:
          openRequests,

        closeout_total_followups:
          followRows.length,

        closeout_open_followups:
          openFollowUps,

        closeout_end_report_items:
          endItems,

        closeout_client_items:
          clientItems

      })
      .eq("id", currentShow.id);


  if (error) {
    alert(error.message);
    return;
  }


  currentShow = null;

  activeRequests = [];
  completedRequests = [];

  initialRequestLoad = true;
  knownRequestIds = new Set();
  knownClaimedBy = new Map();

  await showActive();
}


function startRealtime() {
  if (realtimeStarted) {
    return;
  }

  realtimeStarted = true;

  openRealtimeChannel();

  startSafetyPoll();

  document.addEventListener(
    "visibilitychange",
    () => {
      if (document.visibilityState === "visible") {
        triggerAutoRefresh();
      }
    }
  );

  window.addEventListener(
    "focus",
    () => {
      triggerAutoRefresh();
    }
  );
}


function openRealtimeChannel() {

  if (realtimeChannel) {
    // A live channel object already exists - never open a second one.
    return;
  }

  const channel =
    sb
      .channel("truck-help-v1")
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "Requests"
        },
        async () => {
          // New-request and hand-off detection both happen inside
          // loadRequests() itself, by comparing against this client's
          // own previous in-memory state - not the realtime payload,
          // which doesn't reliably carry the previous row.
          await triggerAutoRefresh();
        }
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "Cable_Checkouts"
        },
        async payload => {
          console.log(
            "Cable realtime update:",
            payload.eventType
          );

          await loadDashboardCablesOut();

          if (!activeView.classList.contains("hidden")) {
            renderActive();
          }
        }
      )
      .subscribe((status, err) => {

        // Ignore status events from a channel that is no longer the
        // active one - e.g. the CLOSED event our own cleanup call to
        // sb.removeChannel() generates on the old channel during a
        // reconnect. Without this, that expected cleanup event would
        // re-trigger scheduleRealtimeReconnect() on its own.
        if (channel !== realtimeChannel) {
          return;
        }

        if (status === "SUBSCRIBED") {
          console.log(
            "Truck Help realtime: subscribed."
          );
          return;
        }

        if (
          status === "CHANNEL_ERROR" ||
          status === "TIMED_OUT" ||
          status === "CLOSED"
        ) {
          console.warn(
            "Truck Help realtime: " + status,
            err || ""
          );

          scheduleRealtimeReconnect();
        }
      });

  realtimeChannel = channel;
}


function scheduleRealtimeReconnect() {

  if (realtimeReconnectTimer) {
    // A reconnect attempt is already pending - never stack timers
    // or race multiple simultaneous reconnects.
    return;
  }

  const staleChannel = realtimeChannel;
  realtimeChannel = null;

  realtimeReconnectTimer = setTimeout(async () => {

    realtimeReconnectTimer = null;

    if (staleChannel) {
      try {
        await sb.removeChannel(staleChannel);
      } catch (e) {
        console.warn(
          "Truck Help realtime: cleanup failed",
          e
        );
      }
    }

    openRealtimeChannel();

  }, 5000);
}


function startSafetyPoll() {

  if (safetyPollIntervalId) {
    return;
  }

  // 30-second fallback only. Realtime remains the primary path; this
  // just re-fetches in case a realtime event was ever missed. Skips
  // the network round-trip entirely when there is no active show.
  safetyPollIntervalId = setInterval(() => {

    if (!currentShow) {
      return;
    }

    triggerAutoRefresh();

  }, 30000);
}


async function triggerAutoRefresh() {

  if (autoRefreshInFlight) {
    // Something else is already mid-refresh (realtime, poll, focus,
    // visibility change all funnel through here). Don't start a
    // second concurrent load - just note that another pass is
    // needed once the current one finishes, so nothing is lost.
    autoRefreshPending = true;
    return;
  }

  autoRefreshInFlight = true;

  try {
    await loadRequests();
  } finally {
    autoRefreshInFlight = false;

    if (autoRefreshPending) {
      autoRefreshPending = false;
      triggerAutoRefresh();
    }
  }
}


function showNewRequestToast(newRows) {

  const el =
    document.getElementById("requestToast");

  if (!el || !newRows || !newRows.length) {
    return;
  }

  if (newRows.length === 1) {

    const r = newRows[0];

    const description =
      r.description || "";

    const shortDescription =
      description.length > 80
        ? description.slice(0, 80) + "…"
        : description;

    el.innerHTML = `
      <strong>New Request</strong>
      ${escapeHtml(r.requester_name || "Unknown")}
      ${
        r.location
          ? " — " + escapeHtml(r.location)
          : ""
      }
      ${
        shortDescription
          ? `
            <div style="margin-top:4px;opacity:.85;">
              ${escapeHtml(shortDescription)}
            </div>
          `
          : ""
      }
    `;

  } else {

    el.innerHTML = `
      <strong>New Requests</strong>
      ${newRows.length} new requests just came in.
    `;
  }

  el.classList.remove("hidden");

  if (requestToastTimeoutId) {
    clearTimeout(requestToastTimeoutId);
  }

  requestToastTimeoutId = setTimeout(() => {
    el.classList.add("hidden");
    requestToastTimeoutId = null;
  }, 6000);
}


function ding() {
  try {
    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!sharedAudioCtx) {
      sharedAudioCtx = new AudioCtx();
    }

    const ctx = sharedAudioCtx;

    if (ctx.state === "suspended") {
      // Best-effort - browser autoplay rules may still block this
      // outside a user gesture. The existing try/catch already
      // covers total audio failure below.
      ctx.resume().catch(() => {});
    }

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.frequency.value = 880;

    gain.gain.setValueAtTime(
      0.12,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      ctx.currentTime + 0.16
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.16);
  } catch (e) {
    console.log("Audio notification unavailable.");
  }
}

function formatDate(value) {
  if (!value) return "—";

  try {
    return new Date(value)
      .toLocaleString();
  } catch {
    return value;
  }
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

<script>
async function enablePhoneAlerts() {
  try {
    if (!("Notification" in window) ||
        !("serviceWorker" in navigator) ||
        !("PushManager" in window)) {
      alert("Push notifications are not supported on this device.");
      return;
    }

    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
      alert("Notification permission was not enabled.");
      return;
    }

    const registration = await navigator.serviceWorker.ready;

    const publicKey =
      "BDApYPlf3vJ6nK43u6jbgKdKVbPYps9X3WgYdzkh_LzhoVQ6x4-MbZBN28f6wyDEGf7tr5lYbEB_t0kKWv8vf9g";

    function urlBase64ToUint8Array(base64String) {
      const padding = "=".repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding)
        .replace(/-/g, "+")
        .replace(/_/g, "/");

      const rawData = window.atob(base64);
      return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
    }

    let subscription =
      await registration.pushManager.getSubscription();

    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey)
      });
    }

    const {
      data: { user },
      error: userError
    } = await sb.auth.getUser();

    if (userError || !user) {
      throw new Error("Could not identify logged-in engineer.");
    }

    const json = subscription.toJSON();

    const { error } = await sb
      .from("Push_Subscriptions")
      .upsert({
        user_id: user.id,
        endpoint: json.endpoint,
        p256dh: json.keys.p256dh,
        auth_key: json.keys.auth,
        device_name: "iPhone",
        active: true
      }, {
        onConflict: "endpoint"
      });

    if (error) throw error;

    const btn = document.getElementById("enablePhoneAlertsBtn");
    if (btn) btn.textContent = "PHONE ALERTS ENABLED";

    alert("This iPhone is subscribed to Truck Help alerts.");

  } catch (err) {
    console.error("Phone alert setup failed:", err);
    alert("Could not subscribe this iPhone to Truck Help alerts.");
  }
}

window.addEventListener("load", () => {
  if ("Notification" in window && Notification.permission === "granted") {
    const btn = document.getElementById("enablePhoneAlertsBtn");
    if (btn) btn.textContent = "PHONE ALERTS ENABLED";
  }
});
</script>
