<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truck Help - Engineering</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #0b1728;
  color: #ffffff;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

.topbar {
  background: #07111f;
  border-bottom: 1px solid #26364c;
  padding: 14px 18px;
  position: sticky;
  top: 0;
  z-index: 20;
}

.topbar-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: space-between;
}

.brand {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: .8px;
}

.user-line {
  font-size: 14px;
  color: #cbd5e1;
  text-align: right;
}

.menu-btn {
  width: auto;
  margin: 0;
  padding: 9px 13px;
  background: #1f3148;
  color: white;
  border: 0;
  border-radius: 7px;
  font-weight: bold;
}

.page {
  max-width: 1100px;
  margin: 0 auto;
  padding: 18px;
}

.panel {
  background: #ffffff;
  color: #172033;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,.2);
}

.login-wrap {
  max-width: 430px;
  margin: 70px auto;
}

h1, h2, h3 {
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin: 14px 0 6px;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #b8c2d0;
  border-radius: 7px;
  background: white;
  color: #172033;
}

textarea {
  min-height: 95px;
  resize: vertical;
}

.primary,
.secondary,
.danger,
.priority-btn,
.small-btn {
  border: 0;
  border-radius: 7px;
  font-weight: 800;
  padding: 12px 14px;
}

.primary {
  background: #2563eb;
  color: white;
}

.secondary {
  background: #1f3148;
  color: white;
}

.danger {
  background: #b91c1c;
  color: white;
}

.priority-btn {
  background: #991b1b;
  color: white;
}

.small-btn {
  padding: 8px 11px;
  background: #e5e7eb;
  color: #172033;
}

.full {
  width: 100%;
}

.error {
  color: #b91c1c;
  margin-top: 12px;
  font-weight: bold;
}

.success {
  color: #166534;
  margin-top: 12px;
  font-weight: bold;
}

.show-header {
  background: #ffffff;
  color: #172033;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 16px;
}

.show-title {
  font-size: 24px;
  font-weight: 900;
}

.show-venue {
  color: #64748b;
  margin-top: 3px;
}

.tally {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 16px;
}

.tally-box {
  background: #eef2f7;
  border-radius: 9px;
  padding: 12px;
  text-align: center;
}

.tally-number {
  font-size: 25px;
  font-weight: 900;
}

.tally-label {
  font-size: 12px;
  color: #64748b;
  text-transform: uppercase;
  font-weight: bold;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
}

.tab {
  flex: 1;
  border: 0;
  border-radius: 7px;
  padding: 11px;
  background: #1f3148;
  color: white;
  font-weight: bold;
}

.tab.active {
  background: #f59e0b;
  color: #111827;
}

.requests {
  display: grid;
  gap: 14px;
}

.request-card {
  background: white;
  color: #172033;
  border-radius: 11px;
  overflow: hidden;
  border-left: 7px solid #2563eb;
  box-shadow: 0 5px 18px rgba(0,0,0,.18);
}

.request-card.in-progress {
  border-left-color: #f59e0b;
}

.request-card.priority {
  border-left-color: #dc2626;
  box-shadow: 0 0 0 2px #dc2626, 0 5px 18px rgba(0,0,0,.2);
}

.status-bar {
  padding: 10px 14px;
  font-weight: 900;
  background: #eff6ff;
}

.in-progress .status-bar {
  background: #fff7ed;
}

.priority .status-bar {
  background: #fee2e2;
  color: #991b1b;
}

.request-body {
  padding: 15px;
}

.request-name {
  font-size: 20px;
  font-weight: 900;
}

.meta {
  margin-top: 5px;
  color: #475569;
  line-height: 1.55;
}

.phone-link {
  color: #2563eb;
  font-weight: bold;
  text-decoration: none;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 12px 0;
}

.badge {
  background: #dbeafe;
  color: #1e3a8a;
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 900;
  text-transform: uppercase;
}

.badge.type {
  background: #e2e8f0;
  color: #334155;
}

.help-label {
  font-size: 12px;
  font-weight: 900;
  color: #64748b;
  text-transform: uppercase;
}

.description {
  font-size: 17px;
  margin-top: 5px;
  white-space: pre-wrap;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}

.actions button {
  width: auto;
}

.empty {
  background: white;
  color: #64748b;
  border-radius: 10px;
  padding: 28px;
  text-align: center;
}

.menu-board {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 12px;
}

.menu-card {
  background: white;
  color: #172033;
  border: 0;
  border-radius: 11px;
  padding: 22px 16px;
  text-align: left;
}

.menu-card strong {
  display: block;
  font-size: 18px;
}

.menu-card span {
  display: block;
  margin-top: 5px;
  color: #64748b;
}

.section-header {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  margin-bottom: 15px;
}

.engineer-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  border-bottom: 1px solid #e5e7eb;
  padding: 12px 0;
}

.engineer-row:last-child {
  border-bottom: 0;
}

.engineer-name {
  font-weight: 900;
}

.engineer-role {
  color: #64748b;
  font-size: 14px;
}

.inactive {
  opacity: .55;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 100;
}

.modal {
  width: min(500px, 100%);
  background: white;
  color: #172033;
  border-radius: 12px;
  padding: 20px;
  max-height: 90vh;
  overflow: auto;
}

.engineer-choice {
  width: 100%;
  border: 0;
  border-radius: 8px;
  padding: 13px;
  margin-top: 8px;
  background: #eaf0f7;
  color: #172033;
  text-align: left;
  font-weight: 800;
}

.completed-card {
  background: white;
  color: #172033;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 12px;
}

.completed-meta {
  color: #64748b;
  font-size: 14px;
  line-height: 1.5;
}

.note {
  background: #f1f5f9;
  border-radius: 7px;
  padding: 10px;
  margin-top: 10px;
}

.no-show {
  background: white;
  color: #172033;
  border-radius: 12px;
  padding: 30px;
  text-align: center;
}



.report-type-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 7px;
}

.report-type-tab {
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  padding: 11px;
  background: #eef2f7;
  color: #172033;
  font-weight: 900;
}

.report-type-tab.active {
  background: #2563eb;
  color: white;
  border-color: #2563eb;
}

.client-report-totals {
  grid-template-columns: repeat(3, 1fr);
}

.client-report-category {
  margin-top: 22px;
}

.client-report-category h3 {
  color: #b91c1c;
  border-bottom: 2px solid #b91c1c;
  padding-bottom: 6px;
  margin-bottom: 10px;
  font-weight: 900;
}

.report-sheet {
  background: white;
  color: #172033;
}

.report-title {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: .5px;
}

.report-show {
  font-size: 20px;
  font-weight: 800;
  margin-top: 6px;
}

.report-meta {
  margin-top: 14px;
  line-height: 1.7;
}

.report-totals {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 18px 0;
}

.report-total-box {
  background: #eef2f7;
  border-radius: 8px;
  padding: 12px;
  text-align: center;
}

.report-total-number {
  font-size: 24px;
  font-weight: 900;
}

.report-total-label {
  font-size: 12px;
  color: #64748b;
  text-transform: uppercase;
  font-weight: bold;
}

.report-category {
  margin-top: 22px;
}

.report-category h3 {
  border-bottom: 2px solid #172033;
  padding-bottom: 6px;
  margin-bottom: 10px;
}

.report-item {
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 10px;
  break-inside: avoid;
}

.report-item-head {
  font-size: 17px;
  margin-bottom: 8px;
}

.report-item-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 14px;
  font-size: 14px;
}

.report-note {
  background: #f1f5f9;
  border-radius: 6px;
  padding: 9px;
  margin-top: 9px;
}

.report-none {
  border: 1px dashed #94a3b8;
  border-radius: 8px;
  padding: 18px;
  color: #64748b;
  text-align: center;
}

@media print {
  body {
    background: white !important;
    color: black !important;
  }

  .topbar,
  .no-print,
  .report-type-tabs {
    display: none !important;
  }

  .page {
    max-width: none;
    padding: 0;
  }

  .panel {
    box-shadow: none;
    padding: 0;
  }

  .report-sheet {
    color: black;
  }

  .report-total-box {
    border: 1px solid #999;
    background: white;
  }

  .report-item {
    border: 1px solid #999;
  }

  .report-note {
    background: white;
    border: 1px solid #ccc;
  }
}

@media (max-width: 650px) {
  .page {
    padding: 12px;
  }

  .menu-board {
    grid-template-columns: 1fr;
  }

  .topbar-inner {
    align-items: flex-start;
  }

  .user-line {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div id="loginView" class="page">
  <div class="login-wrap panel">
    <h2>Truck Help Engineering</h2>

    <label>Email</label>
    <input id="email" type="email" autocomplete="username">

    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password">

    <button id="loginBtn" class="primary full" style="margin-top:18px;">
      LOGIN
    </button>

    <div id="loginError" class="error"></div>
  </div>
</div>

<div id="appView" class="hidden">

  <div class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand">TRUCK HELP</div>
        <div id="currentEngineerLine" class="user-line"></div>
      </div>

      <button id="menuBtn" class="menu-btn">MENU</button>
    </div>
  </div>

  <div class="page">

    <div id="activeView"></div>
    <div id="menuView" class="hidden"></div>
    <div id="completedView" class="hidden"></div>
    <div id="reportsView" class="hidden"></div>
    <div id="engineersView" class="hidden"></div>
    <div id="showsView" class="hidden"></div>

  </div>
</div>

<div id="modalBackdrop" class="modal-backdrop hidden">
  <div id="modal" class="modal"></div>
</div>

<script>
const SUPABASE_URL = "https://cnqeqehgpidrsuerjzbg.supabase.co";
const SUPABASE_KEY = "sb_publishable_voofaOaydNBIQvXKMXZ2lA_Daj2GPXU";

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let selectedEngineer = null;
let activeEngineers = [];
let currentShow = null;
let activeRequests = [];
let completedRequests = [];
let requestFilter = "all";
let reportType = "end";

let realtimeStarted = false;
let knownRequestIds = new Set();
let initialRequestLoad = true;

const loginView = document.getElementById("loginView");
const appView = document.getElementById("appView");
const activeView = document.getElementById("activeView");
const menuView = document.getElementById("menuView");
const completedView = document.getElementById("completedView");
const reportsView = document.getElementById("reportsView");
const engineersView = document.getElementById("engineersView");
const showsView = document.getElementById("showsView");
const modalBackdrop = document.getElementById("modalBackdrop");
const modal = document.getElementById("modal");

document.getElementById("loginBtn")
  .addEventListener("click", login);

document.getElementById("menuBtn")
  .addEventListener("click", showMenu);

async function login() {
  document.getElementById("loginError").textContent = "";

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const { error } =
    await sb.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    document.getElementById("loginError").textContent =
      error.message;
    return;
  }

  await initializeApp();
}

async function logout() {
  await sb.auth.signOut();

  selectedEngineer = null;

  loginView.classList.remove("hidden");
  appView.classList.add("hidden");
}

async function checkSession() {
  const { data } = await sb.auth.getSession();

  if (data.session) {
    await initializeApp();
  } else {
    loginView.classList.remove("hidden");
    appView.classList.add("hidden");
  }
}

async function initializeApp() {
  loginView.classList.add("hidden");
  appView.classList.remove("hidden");

  await loadEngineers();

  const savedId =
    localStorage.getItem("truckHelpEngineerId");

  if (savedId) {
    selectedEngineer =
      activeEngineers.find(
        e => String(e.id) === String(savedId)
      ) || null;
  }

  updateEngineerLine();

  if (!selectedEngineer) {
    if (activeEngineers.length) {
      chooseEngineer();
    } else {
      showEngineers();
    }
  } else {
    await showActive();
  }

  startRealtime();
}

function updateEngineerLine() {
  const line =
    document.getElementById("currentEngineerLine");

  if (!selectedEngineer) {
    line.textContent = "No engineer selected";
    return;
  }

  line.textContent =
    selectedEngineer.name +
    (selectedEngineer.role
      ? " · " + selectedEngineer.role
      : "");
}

async function loadEngineers() {
  const { data, error } = await sb
    .from("Engineers")
    .select("*")
    .order("name");

  if (error) {
    console.error(error);
    return;
  }

  activeEngineers =
    (data || []).filter(e => e.active);
}

async function loadCurrentShow() {
  const { data, error } = await sb
    .from("Shows")
    .select("*")
    .eq("active", true)
    .limit(1)
    .maybeSingle();

  if (error) {
    console.error(error);
    currentShow = null;
    return;
  }

  currentShow = data || null;
}

async function loadRequests() {
  if (!currentShow) {
    activeRequests = [];
    completedRequests = [];
    renderActive();
    return;
  }

  const { data, error } = await sb
    .from("Requests")
    .select("*")
    .eq("show_id", currentShow.id)
    .order("created_at", { ascending: true });

  if (error) {
    console.error(error);
    return;
  }

  const rows = data || [];

  const newIds =
    rows
      .filter(r => r.status !== "complete")
      .map(r => String(r.id))
      .filter(id => !knownRequestIds.has(id));

  activeRequests =
    rows.filter(r => r.status !== "complete");

  completedRequests =
    rows.filter(r => r.status === "complete")
      .sort((a,b) =>
        new Date(b.completed_at || b.created_at) -
        new Date(a.completed_at || a.created_at)
      );

  if (!initialRequestLoad && newIds.length) {
    ding();
  }

  knownRequestIds =
    new Set(
      rows
        .filter(r => r.status !== "complete")
        .map(r => String(r.id))
    );

  initialRequestLoad = false;

  renderActive();

  if (!completedView.classList.contains("hidden")) {
    renderCompleted();
  }
}

function sortActiveRequests(rows) {
  return [...rows].sort((a,b) => {
    if (!!a.is_priority !== !!b.is_priority) {
      return a.is_priority ? -1 : 1;
    }

    return new Date(a.created_at) -
           new Date(b.created_at);
  });
}

async function showActive() {
  hideViews();
  activeView.classList.remove("hidden");

  await loadCurrentShow();
  await loadRequests();
}

function renderActive() {
  if (activeView.classList.contains("hidden")) {
    return;
  }

  if (!currentShow) {
    activeView.innerHTML = `
      <div class="no-show">
        <h2>NO ACTIVE SHOW</h2>
        <p>Start a show before accepting crew requests.</p>
        <button class="primary"
          onclick="showShows()">
          START NEW SHOW
        </button>

      
      </div>
    `;
    return;
  }

  const inProgressCount =
    activeRequests.filter(
      r => r.status === "in-progress"
    ).length;

  let rows = sortActiveRequests(activeRequests);

  if (requestFilter === "mine" && selectedEngineer) {
    rows =
      rows.filter(
        r => r.claimed_by === selectedEngineer.name
      );
  }

  activeView.innerHTML = `
    <div class="show-header">
      <div class="show-title">
        ${escapeHtml(currentShow.show_name)}
      </div>
      <div class="show-venue">
        ${escapeHtml(currentShow.venue || "")}
      </div>

      <div class="tally">
        <div class="tally-box">
          <div class="tally-number">
            ${activeRequests.length}
          </div>
          <div class="tally-label">Active</div>
        </div>

        <div class="tally-box">
          <div class="tally-number">
            ${inProgressCount}
          </div>
          <div class="tally-label">In Progress</div>
        </div>

        <div class="tally-box">
          <div class="tally-number">
            ${completedRequests.length}
          </div>
          <div class="tally-label">Completed</div>
        </div>
      </div>
    </div>

    <div class="tabs">
      <button
        class="tab ${requestFilter === "all" ? "active" : ""}"
        onclick="setRequestFilter('all')">
        ALL REQUESTS
      </button>

      <button
        class="tab ${requestFilter === "mine" ? "active" : ""}"
        onclick="setRequestFilter('mine')">
        MY REQUESTS
      </button>
    </div>

    <div class="requests">
      ${
        rows.length
        ? rows.map(requestCardHtml).join("")
        : `<div class="empty">No active requests.</div>`
      }
    </div>
  `;
}

function requestCardHtml(r) {
  const isProgress =
    r.status === "in-progress";

  const classes = [
    "request-card",
    isProgress ? "in-progress" : "",
    r.is_priority ? "priority" : ""
  ].join(" ");

  let statusText = "NEW REQUEST";

  if (isProgress) {
    statusText =
      "IN PROGRESS" +
      (r.claimed_by
        ? " — " + escapeHtml(r.claimed_by)
        : "");
  }

  if (r.is_priority) {
    statusText =
      "PRIORITY — " + statusText;
  }

  let phone = "";

  if (r.phone) {
    const safePhone =
      String(r.phone).replace(/[^\d+]/g, "");

    phone = `
      <div>
        📱
        <a class="phone-link"
          href="sms:${safePhone}">
          ${escapeHtml(r.phone)}
        </a>
      </div>
    `;
  }

  let claimAction = "";

  if (r.status === "new") {
    claimAction = `
      <button class="primary"
        onclick="claimRequest(${r.id})">
        CLAIM REQUEST
      </button>
    `;
  } else if (
    selectedEngineer &&
    r.claimed_by !== selectedEngineer.name
  ) {
    claimAction = `
      <button class="primary"
        onclick="takeOverRequest(${r.id})">
        TAKE OVER
      </button>
    `;
  }

  return `
    <div class="${classes}">
      <div class="status-bar">
        ${statusText}
      </div>

      <div class="request-body">

        <div class="request-name">
          ${escapeHtml(r.requester_name || "")}
        </div>

        <div class="meta">
          <div>
            📍 ${escapeHtml(r.location || "")}
          </div>
          ${phone}
        </div>

        <div class="badges">
          <span class="badge">
            ${escapeHtml(r.department || "Other")}
          </span>

          <span class="badge type">
            ${escapeHtml(r.request_type || "Other")}
          </span>
        </div>

        <div class="help-label">
          How can we help?
        </div>

        <div class="description">
          ${escapeHtml(r.description || "")}
        </div>

        <div class="actions">

          ${claimAction}

          ${
            isProgress
            ? `
              <button class="secondary"
                onclick="openHandoff(${r.id})">
                HAND OFF
              </button>

              <button class="secondary"
                onclick="openComplete(${r.id})">
                COMPLETE
              </button>
            `
            : ""
          }

          ${
            r.is_priority
            ? `
              <button class="small-btn"

async function getCurrentShowEngineers() {

  if (!currentShow) {
    await loadCurrentShow();
  }

  if (!currentShow) {
    return [];
  }

  const { data: assignments, error: assignmentError } =
    await sb
      .from("Show_Engineers")
      .select("engineer_id, sort_order")
      .eq("show_id", currentShow.id)
      .order("sort_order");

  if (assignmentError) {
    alert(assignmentError.message);
    return [];
  }

  if (!assignments || !assignments.length) {
    return [];
  }

  const ids =
    assignments.map(a => a.engineer_id);

  const { data: engineers, error: engineerError } =
    await sb
      .from("Engineers")
      .select("id, name, role, active")
      .in("id", ids);

  if (engineerError) {
    alert(engineerError.message);
    return [];
  }

  const engineerMap =
    new Map(
      (engineers || []).map(e => [
        String(e.id),
        e
      ])
    );

  return assignments
    .map(a =>
      engineerMap.get(String(a.engineer_id))
    )
    .filter(Boolean);
}


async function selectedEngineerIsOnShow() {

  if (!selectedEngineer) {

    );

  if (!found) {
    alert(

    return false;
  }

  return true;
}

async function uploadCompletionPhotos(requestId) {

  const input =
    document.getElementById("completionPhotos");

  if (!input) {
    return { ok: true, uploaded: [] };
  }

  const files =
    Array.from(input.files || []);

  if (!files.length) {
    return { ok: true, uploaded: [] };
  }

  const uploaded = [];

  for (let index = 0; index < files.length; index++) {

    const file = files[index];

    const captionInput =
      document.getElementById(
        `completionPhotoCaption_${index}`
      );

    const caption =
      captionInput
        ? captionInput.value.trim()
        : "";

    const originalName =
      file.name || "photo";

    const dot =
      originalName.lastIndexOf(".");

    const extension =
      dot >= 0
        ? originalName.substring(dot).toLowerCase()
        : "";

    const uniqueId =
      typeof crypto !== "undefined" &&
      typeof crypto.randomUUID === "function"
        ? crypto.randomUUID()
        : `${Date.now()}-${index}-${Math.random()
            .toString(36)
            .slice(2)}`;

    const storagePath =
      `${requestId}/${uniqueId}${extension}`;

    const { error: uploadError } =
      await sb.storage
        .from("request-photos")
        .upload(
          storagePath,
          file,
          {
            cacheControl: "3600",
            upsert: false,
            contentType:
              file.type || undefined
          }
        );

    if (uploadError) {

      await cleanupCompletionPhotoUploads(
        uploaded
      );

      return {
        ok: false,
        uploaded: [],
        error:
          "Photo upload failed:\n\n" +
          uploadError.message
      };
    }

    const { data: photoRecord, error: recordError } =
      await sb
        .from("Request_Photos")
        .insert({
          request_id: requestId,
          storage_path: storagePath,
          caption: caption || null,
          added_by:
            selectedEngineer
              ? selectedEngineer.name
              : "Unknown Engineer"
        })
        .select("id, storage_path")
        .single();

    if (recordError) {

      await sb.storage
        .from("request-photos")
        .remove([storagePath]);

      await cleanupCompletionPhotoUploads(
        uploaded
      );

      return {
        ok: false,
        uploaded: [],
        error:
          "Photo record could not be saved:\n\n" +
          recordError.message
      };
    }

    uploaded.push({
      id: photoRecord.id,
      storage_path: storagePath
    });
  }

  return {
    ok: true,
    uploaded
  };
}


async function cleanupCompletionPhotoUploads(uploaded) {

  if (!uploaded || !uploaded.length) {
    return;
  }

  const ids =
    uploaded
      .map(item => item.id)
      .filter(Boolean);

  const paths =
    uploaded
      .map(item => item.storage_path)
      .filter(Boolean);

  if (ids.length) {

    await sb
      .from("Request_Photos")
      .delete()
      .in("id", ids);
  }

  if (paths.length) {

    await sb.storage
      .from("request-photos")
      .remove(paths);
  }
}


async function completeRequest(id) {
  const notes =
    document.getElementById("resolutionNotes")
      .value.trim();

  const gearLocationValue =
    document.getElementById("gearLocation")
      .value.trim();



  const endOfShow =
    document.getElementById("endOfShowCheck").checked;

  const category =
    endOfShow
      ? document.getElementById("endOfShowCategory").value
      : null;

  const clientReport =
    document.getElementById("clientReportCheck").checked;

  const clientCategory =
    clientReport
      ? document.getElementById("clientReportCategory").value
      : null;
  const createFollowUp =
    document.getElementById("followUpCheck").checked;

  const followUpCategory =
    createFollowUp
      ? document.getElementById("followUpCategory").value
      : null;

  const followUpNextAction =
    createFollowUp
      ? document.getElementById("followUpNextAction").value.trim()
      : null;

  if (createFollowUp && !followUpNextAction) {

    alert("Please enter a short Next Action.");

    return;

  }

  
  const photoUploadResult =
    await uploadCompletionPhotos(id);

  if (!photoUploadResult.ok) {

    alert(photoUploadResult.error);

    return;
  }


const { data: requestRecord, error: requestLookupError } =
    await sb
      .from("Requests")
      .select("description, show_id")
      .eq("id", id)
      .single();

  if (requestLookupError) {

    alert(requestLookupError.message);

    return;

  }



  const { error } = await sb
    .from("Requests")
    .update({
      status: "complete",
      completed_at: new Date().toISOString(),
      completed_by:
        selectedEngineer
          ? selectedEngineer.name
          : null,
      resolution_notes:
        notes || null,

      gear_location:
        gearLocationValue || null,

      end_of_show_report: endOfShow,
      end_of_show_category: category,
      client_report: clientReport,
      client_report_category: clientCategory
    })
    .eq("id", id);

  if (error) {

    await cleanupCompletionPhotoUploads(
      photoUploadResult.uploaded
    );

    alert(error.message);

    return;

  }
  if (createFollowUp) {

    const { error: followUpError } = await sb
      .from("Follow_Ups")
      .insert({
        request_id: id,
        show_id: requestRecord.show_id,
        category: followUpCategory,
        title: requestRecord.description || "Follow-Up",
        next_action: followUpNextAction,
        status: "open",
        created_by:
          selectedEngineer
            ? selectedEngineer.name
            : null
      });

    if (followUpError) {

      alert(
        "Request completed, but Follow-Up could not be saved:\n\n" +
        followUpError.message
      );

      closeModal();

      await loadRequests();

      return;

    }

  }



  closeModal();
  await loadRequests();
}

function filterRequestHistory() {

  const search =
    (
      document.getElementById("historySearch")
        ?.value || ""
    )
      .trim()
      .toLowerCase();


  const department =
    document.getElementById("historyDepartment")
      ?.value || "";


  const status =
    document.getElementById("historyStatus")
      ?.value || "";


  const engineer =
    document.getElementById("historyEngineer")
      ?.value || "";


  const priority =
    document.getElementById("historyPriority")
      ?.value || "";


  const cards =
    document.querySelectorAll(
      ".request-history-card"
    );


  let visible = 0;


  cards.forEach(card => {

    const matchesSearch =
      !search ||
      (card.dataset.search || "")
        .includes(search);


    const matchesDepartment =
      !department ||
      card.dataset.department === department;


    const matchesStatus =
      !status ||
      card.dataset.status === status;


    const matchesEngineer =
      !engineer ||
      (card.dataset.engineers || "")
        .includes(engineer);


    const matchesPriority =
      !priority ||
      card.dataset.priority === priority;


    const show =
      matchesSearch &&
      matchesDepartment &&
      matchesStatus &&
      matchesEngineer &&
      matchesPriority;


    card.style.display =
      show ? "" : "none";


    if (show) {
      visible++;
    }
  });


  const count =
    document.getElementById(
      "historyResultCount"
    );


  if (count) {

    count.textContent =
      visible === 1
        ? "1 request"
        : `${visible} requests`;
  }


  const noResults =
    document.getElementById(
      "requestHistoryNoResults"
    );


  if (noResults) {

    noResults.style.display =
      visible === 0
        ? "block"
        : "none";
  }
}

async function saveAdditionalRequestPhotos(requestId) {

  const input =
    document.getElementById("detailPhotoInput");

  const files =
    input
      ? Array.from(input.files || [])
      : [];

  if (!files.length) {

    alert("Choose at least one photo.");

    return;
  }

  const uploaded = [];

  for (let index = 0; index < files.length; index++) {

    const file = files[index];

    const captionInput =
      document.getElementById(
        `detailPhotoCaption_${index}`
      );

    const caption =
      captionInput
        ? captionInput.value.trim()
        : "";

    const originalName =
      file.name || "photo";

    const dot =
      originalName.lastIndexOf(".");

    const extension =
      dot >= 0
        ? originalName.substring(dot).toLowerCase()
        : "";

    const uniqueId =
      typeof crypto !== "undefined" &&
      typeof crypto.randomUUID === "function"
        ? crypto.randomUUID()
        : `${Date.now()}-${index}-${Math.random()
            .toString(36)
            .slice(2)}`;

    const storagePath =
      `${requestId}/${uniqueId}${extension}`;

    const { error: uploadError } =
      await sb.storage
        .from("request-photos")
        .upload(
          storagePath,
          file,
          {
            cacheControl: "3600",
            upsert: false,
            contentType:
              file.type || undefined
          }
        );

    if (uploadError) {

      alert(
        "Photo upload failed:\n\n" +
        uploadError.message
      );

      return;
    }

    const { data: record, error: recordError } =
      await sb
        .from("Request_Photos")
        .insert({
          request_id: requestId,
          storage_path: storagePath,
          caption: caption || null,
          added_by:
            selectedEngineer
              ? selectedEngineer.name
              : "Unknown Engineer"
        })
        .select("id")
        .single();

    if (recordError) {

      alert(
        "Photo record could not be saved:\n\n" +
        recordError.message
      );

      return;
    }

    uploaded.push(record);
  }

  closeModal();

  await openRequestDetail(requestId);
}



function printRequestDetail() {

  const box =
    document.getElementById("includeRequestPhotos");

  const includePhotos =
    box && box.checked;

  const photoSections =
    Array.from(
      document.querySelectorAll(
        ".request-photo-section"
      )
    );

  if (!includePhotos) {

    photoSections.forEach(section => {
      section.dataset.beforePrintDisplay =
        section.style.display || "";

      section.style.display = "none";
    });
  }

  const restore = () => {

    photoSections.forEach(section => {

      section.style.display =
        section.dataset.beforePrintDisplay || "";

      delete section.dataset.beforePrintDisplay;
    });
  };

  window.addEventListener(
    "afterprint",
    restore,
    { once:true }
  );

  window.print();

}

function filterPastShows() {

  const input =
    document.getElementById("pastShowSearch");

  if (!input) return;

  const term =
    input.value
      .trim()
      .toLowerCase();

  const cards =
    document.querySelectorAll(".past-show-card");

  let visible = 0;

  cards.forEach(card => {

    const search =
      (card.dataset.search || "")
        .toLowerCase();

    const match =
      !term || search.includes(term);

    card.style.display =
      match ? "" : "none";

    if (match) visible++;
  });

  let message =
    document.getElementById("pastShowNoResults");

  if (!message) {

    message =
      document.createElement("div");

    message.id =
      "pastShowNoResults";

    message.className =
      "empty";

    message.style.marginTop =
      "14px";

    const content =
      document.getElementById("pastShowsContent");

    if (content) {
      content.appendChild(message);
    }
  }

  if (term && visible === 0) {

    message.textContent =
      "No past shows match your search.";

    message.style.display =
      "block";

  } else {

    message.style.display =
      "none";
  }
}

async function saveManualFollowUp() {

  const category =
    document
      .getElementById("manualFollowUpCategory")
      .value;

  const title =
    document
      .getElementById("manualFollowUpTitle")
      .value
      .trim();

  const nextAction =
    document
      .getElementById("manualFollowUpNextAction")
      .value
      .trim();

  const showValue =
    document
      .getElementById("manualFollowUpShow")
      .value;

  if (!title) {
    alert("Please enter what needs attention.");
    return;
  }

  if (!nextAction) {
    alert("Please enter a short Next Action.");
    return;
  }

  const showId =
    showValue
      ? Number(showValue)
      : null;


  // ---------------------------------------------
  // CHECK FOR POSSIBLE DUPLICATE OPEN FOLLOW-UP
  // ---------------------------------------------

  let duplicateQuery = sb
    .from("Follow_Ups")
    .select("id, title, next_action")
    .eq("status", "open");

  if (showId === null) {
    duplicateQuery =
      duplicateQuery.is("show_id", null);
  } else {
    duplicateQuery =
      duplicateQuery.eq("show_id", showId);
  }

  const {
    data: existingFollowUps,
    error: duplicateError
  } = await duplicateQuery;

  if (duplicateError) {
    alert(duplicateError.message);
    return;
  }


  const normalize = value =>
    (value || "")
      .toLowerCase()
      .replace(/[^a-z0-9\s]/g, " ")
      .replace(/\s+/g, " ")
      .trim();


  const newWords =
    normalize(title)
      .split(" ")
      .filter(word => word.length > 2);


  const possibleDuplicate =
    (existingFollowUps || []).find(item => {

      const existingTitle =
        normalize(item.title);

      if (!existingTitle) {
        return false;
      }

      const existingWords =
        existingTitle
          .split(" ")
          .filter(word => word.length > 2);

      if (
        normalize(title) === existingTitle
      ) {
        return true;
      }

      const matchingWords =
        newWords.filter(word =>
          existingWords.includes(word)
        );

      const smallestWordCount =
        Math.min(
          newWords.length,
          existingWords.length
        );

      return (
        smallestWordCount >= 2 &&
        matchingWords.length >=
          Math.ceil(smallestWordCount * 0.6)
      );
    });


  if (possibleDuplicate) {

    const addAnyway = confirm(
      "Possible existing Follow-Up found:\n\n" +
      possibleDuplicate.title +
      "\n\nNext Action: " +
      (possibleDuplicate.next_action || "—") +
      "\n\nAdd this new Follow-Up anyway?"
    );

    if (!addAnyway) {
      return;
    }
  }


  // ---------------------------------------------
  // SAVE FOLLOW-UP
  // ---------------------------------------------

  const { error } = await sb
    .from("Follow_Ups")
    .insert({
      request_id: null,
      show_id: showId,
      category,
      title,
      next_action: nextAction,
      status: "open",
      created_by:
        selectedEngineer
          ? selectedEngineer.name
          : null
    });

  if (error) {
    alert(error.message);
    return;
  }

  closeModal();

  followUpViewStatus = "open";

  await showFollowUps();
}

async function resolveFollowUp(id) {

  const resolution = prompt(
    "Resolution:"
  );

  if (resolution === null) {
    return;
  }

  const cleanResolution = resolution.trim();

  if (!cleanResolution) {
    alert("Please enter a short resolution.");
    return;
  }

  const { error } = await sb
    .from("Follow_Ups")
    .update({
      status: "resolved",
      resolved_at: new Date().toISOString(),
      resolved_by:
        selectedEngineer
          ? selectedEngineer.name
          : null,
      resolution: cleanResolution
    })
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  await showFollowUps();
}

async function loadClientReport(showId) {
  const content =
    document.getElementById("reportContent");

  const { data: show, error: showError } = await sb
    .from("Shows")
    .select("*")
    .eq("id", showId)
    .single();

  if (showError) {
    content.innerHTML =
      `<div class="error">${escapeHtml(showError.message)}</div>`;
    return;
  }

  const { data: requests, error: requestError } = await sb
    .from("Requests")
    .select("*")
    .eq("show_id", showId)
    .eq("client_report", true)
    .order("created_at", { ascending: true });

  if (requestError) {
    content.innerHTML =
      `<div class="error">${escapeHtml(requestError.message)}</div>`;
    return;
  }

  const rows = requests || [];

  // Load documentation photos for client-report items.
  const requestIds = rows.map(r => r.id);

  let photosByRequest = {};

  if (requestIds.length) {

    const { data: reportPhotos, error: photoError } =
      await sb
        .from("Request_Photos")
        .select("*")
        .in("request_id", requestIds)
        .order("created_at", { ascending: true });

    if (photoError) {
      console.error(
        "Client report photo load failed:",
        photoError
      );
    }

    for (const photo of (reportPhotos || [])) {

      const { data: signedData, error: signedError } =
        await sb.storage
          .from("request-photos")
          .createSignedUrl(
            photo.storage_path,
            3600
          );

      if (signedError) {
        console.error(
          "Client report signed URL failed:",
          signedError
        );
        continue;
      }

      if (!photosByRequest[photo.request_id]) {
        photosByRequest[photo.request_id] = [];
      }

      photosByRequest[photo.request_id].push({
        ...photo,
        signed_url: signedData.signedUrl
      });
    }
  }

  rows.forEach(r => {
    r._clientReportPhotos =
      photosByRequest[r.id] || [];
  });


  const damaged =
    rows.filter(
      r => r.client_report_category === "Damaged"
    );

  const missing =
    rows.filter(
      r => r.client_report_category === "Missing"
    );

  content.innerHTML = `
    <div class="report-sheet">

      <div class="report-meta">

          ${escapeHtml(show.venue || "—")}
        </div>

        <div>
          <strong>Start Date:</strong>
          ${escapeHtml(show.start_date || "—")}
        </div>

        <div>
          <strong>Status:</strong>
          ${show.active ? "Active" : "Closed"}
        </div>

        <div>
          <strong>Started By:</strong>
          ${escapeHtml(show.started_by || "—")}
        </div>

        <div>
          <strong>Closed By:</strong>
          ${escapeHtml(show.closed_by || "—")}
        </div>
      </div>

      <div class="report-totals client-report-totals">

        <div class="report-total-box">
          <div class="report-total-number">
            ${rows.length}
          </div>
          <div class="report-total-label">
            Total Client Items
          </div>
        </div>

        <div class="report-total-box">
          <div class="report-total-number">
            ${damaged.length}
          </div>
          <div class="report-total-label">
            Damaged
          </div>
        </div>

        <div class="report-total-box">
          <div class="report-total-number">
            ${missing.length}
          </div>
          <div class="report-total-label">
            Missing
          </div>
        </div>

      </div>

      <div class="no-print"
        style="margin:18px 0;">
        
        <label style="
          display:flex;
          align-items:center;
          gap:6px;
          font-size:13px;
          font-weight:800;
          margin-right:12px;
        ">
          <input
            id="includeClientReportPhotos"
            type="checkbox"
            style="width:auto;margin:0;"
          >
          Include Photos
        </label>

<button class="primary"
          onclick="printClientReport()">
          PRINT REPORT
        </button>
      </div>

      ${
        damaged.length
        ? `
          <div class="client-report-category">
            <h3>DAMAGED</h3>

            ${damaged

        : ""

      ${

            <h3>MISSING</h3>

              .map(clientReportItemHtml)

            were recorded for this show.

function printClientReport() {

  const box =
    document.getElementById(
      "includeClientReportPhotos"
    );

  const includePhotos =
    box && box.checked;

  const photoSections =
    Array.from(
      document.querySelectorAll(
        ".client-report-photo-section"
      )
    );

  if (!includePhotos) {

    photoSections.forEach(section => {

      section.dataset.beforePrintDisplay =
        section.style.display || "";

      section.style.display = "none";
    });
  }

  const restore = () => {

    photoSections.forEach(section => {

      section.style.display =
        section.dataset.beforePrintDisplay || "";

      delete section.dataset.beforePrintDisplay;
    });
  };

  window.addEventListener(
    "afterprint",
    restore,
    { once:true }
  );

  window.print();
}

    .from("Engineers")

async function toggleEngineer(id, active) {
  const { error } = await sb
    .from("Engineers")
    .update({ active })
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  if (
    selectedEngineer &&
    String(selectedEngineer.id) === String(id) &&
    !active
  ) {
    selectedEngineer = null;
    localStorage.removeItem("truckHelpEngineerId");
    updateEngineerLine();
  }

  await loadEngineers();
  await showEngineers();
}

        start_date: startDate || null,
        main_unit: mainUnit,
        b_unit: bUnit || null,
        active: true,
        started_by:
          selectedEngineer
            ? selectedEngineer.name
            : null
      })
      .select()
      .single();

  if (error) {
    alert(error.message);
    return;
  }

  if (selectedCrew.length) {

    const crewRows =
      selectedCrew.map((engineerId, index) => ({
        show_id: newShow.id,
        engineer_id: engineerId,
        sort_order: index
      }));

    const { error: crewError } =
      await sb
        .from("Show_Engineers")
        .insert(crewRows);

    if (crewError) {
      alert(
        "Show started, but crew assignments could not be saved:\n\n" +
        crewError.message
      );
      return;
    }
  }

  initialRequestLoad = true;
  knownRequestIds = new Set();

  await showActive();
}


async function confirmCloseShow() {

  await loadRequests();

  const requestCount =
    activeRequests.length;

  const { data: followUps, error: followUpError } =
    await sb
      .from("Follow_Ups")
      .select("id")
      .eq("show_id", currentShow.id)
      .eq("status", "open");

  if (followUpError) {
    alert(followUpError.message);
    return;
  }

  const followUpCount =
    followUps ? followUps.length : 0;

  let text =
    `Close ${currentShow.show_name}?`;

  if (requestCount || followUpCount) {

    text += "\n\n";

    if (requestCount) {
      text +=
        `${requestCount} request(s) are still active.`;
    }

    if (requestCount && followUpCount) {
      text += "\n";
    }

    if (followUpCount) {
      text +=
        `${followUpCount} follow-up(s) are still open.`;
    }
  }

  if (!confirm(text)) {
    return;
  }

  await closeShow();
}


async function closeShow() {
  if (!currentShow) {
    return;
  }

  const { error } = await sb
    .from("Shows")
    .update({
      active: false,
      closed_at: new Date().toISOString(),
      closed_by:
        selectedEngineer
          ? selectedEngineer.name
          : null
    })
    .eq("id", currentShow.id);

  if (error) {
    alert(error.message);
    return;
  }

  currentShow = null;
  activeRequests = [];
  completedRequests = [];
  initialRequestLoad = true;
  knownRequestIds = new Set();

  await showActive();
}

function startRealtime() {
  if (realtimeStarted) {
    return;
  }

  realtimeStarted = true;

  sb
    .channel("truck-help-v1")
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "Requests"
      },
      async payload => {
        const oldAssigned =
          payload.old?.claimed_by;

        const newAssigned =
          payload.new?.claimed_by;

        if (
          selectedEngineer &&
          newAssigned === selectedEngineer.name &&
          oldAssigned &&
          oldAssigned !== selectedEngineer.name
        ) {
          ding();
        }

        await loadRequests();
      }
    )
    .subscribe();
}

function ding() {
  try {
    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.frequency.value = 880;

    gain.gain.setValueAtTime(
      0.12,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      ctx.currentTime + 0.16
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.16);
  } catch (e) {
    console.log("Audio notification unavailable.");
  }
}

function openModal() {
  modalBackdrop.classList.remove("hidden");
}

function closeModal() {
  modalBackdrop.classList.add("hidden");
  modal.innerHTML = "";
}

function hideViews() {
  activeView.classList.add("hidden");
  menuView.classList.add("hidden");
  completedView.classList.add("hidden");
  reportsView.classList.add("hidden");
  engineersView.classList.add("hidden");
  showsView.classList.add("hidden");
}

function formatDate(value) {
  if (!value) return "—";

  try {
    return new Date(value)
      .toLocaleString();
  } catch {
    return value;
  }
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

checkSession();
